<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Focus Lady Bra ERP</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #0b1220;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #1d283a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 1.25rem 0 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
      button {
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #ffffff;
        background: var(--primary);
        border: 1px solid var(--primary);
        border-radius: 0.375rem;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Focus Lady Bra ERP" />
      <h1>You're offline</h1>
      <p>
        Focus Lady Bra ERP needs a connection to reach your Google Sheets data. Reconnect and try
        again — the app itself is already installed on this device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
