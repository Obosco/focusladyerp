directories:
  output: latest-release
  buildResources: build
appId: com.focuslady.erp
productName: FocusLady ERP
executableName: FocusLadyERP
files:
  - filter:
      - electron.cjs
      - preload.js
      - public/icon-512.png
      - public/focus-lady-logo.svg
      - package.json
win:
  target: nsis
  icon: public/icon-512.png
  artifactName: FocusLady-ERP-Setup.exe
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FocusLady ERP
electronVersion: 43.7.5
